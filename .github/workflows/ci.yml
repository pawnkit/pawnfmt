name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    name: Build, vet, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Cache real-world corpus
        uses: actions/cache@v6
        with:
          path: testdata/real-world
          key: real-world-corpus-${{ hashFiles('testdata/real-world/sources.tsv') }}

      - name: Fetch real-world corpus
        run: testdata/real-world/fetch.sh

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Test real-world corpus
        env:
          PAWNFMT_CORPUS: "1"
        run: go test ./internal/format -run=TestCorpusReport

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4

  security:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: govulncheck
        run: go tool govulncheck ./...

  fuzz-smoke:
    name: Fuzz smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Fuzz formatter convergence
        run: go test ./internal/format/... -run=^$ -fuzz=FuzzFormatConverges -fuzztime=30s

  compiler-equivalence:
    name: Compiler equivalence
    runs-on: ubuntu-latest
    steps:
      - name: Check out pawnfmt
        uses: actions/checkout@v7.0.1
        with:
          path: pawnfmt

      - name: Check out pawn-corpus
        uses: actions/checkout@v7.0.1
        with:
          repository: pawnkit/pawn-corpus
          ref: v0.1.13
          path: pawn-corpus

      - uses: actions/setup-go@v7
        with:
          go-version-file: pawnfmt/go.mod

      - name: Download Pawn compiler 3.10.10
        run: |
          curl -fsSL -o pawnc.tar.gz https://github.com/pawn-lang/compiler/releases/download/v3.10.10/pawnc-3.10.10-linux.tar.gz
          tar -xzf pawnc.tar.gz

      - name: Compare compiler results
        working-directory: pawnfmt
        env:
          PAWN_CORPUS_DIR: ${{ github.workspace }}/pawn-corpus
          PAWNFMT_PAWNCC: ${{ github.workspace }}/pawnc-3.10.10-linux/bin/pawncc
        run: go test -count=1 -run '^TestCompilerEquivalence$' ./internal/format

  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run benchmarks
        run: go test ./internal/bench/... -bench=. -benchmem -run=^$ -benchtime=3x | tee bench-results.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: bench-results
          path: bench-results.txt

  support:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pawnkit/pawn-actions/support-check@v1.8.72
        with:
          repository: pawnkit/pawnfmt
          targets: linux-amd64,windows-amd64,darwin-arm64
